name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate Linux visual baselines and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint && pnpm format:check
      - name: Unit, property and component tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @packet-trip/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  e2e:
    needs: check
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: End-to-end tests
        run: pnpm exec playwright test e2e/trip.spec.ts
      - name: Visual snapshots
        if: ${{ !inputs.update_snapshots && hashFiles('e2e/visual.spec.ts-snapshots/*-linux.png') != '' }}
        run: pnpm exec playwright test e2e/visual.spec.ts
      - name: Regenerate Linux baselines
        if: ${{ inputs.update_snapshots }}
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_snapshots }}
        with:
          name: linux-baselines
          path: e2e/visual.spec.ts-snapshots/*-linux.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
